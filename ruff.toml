line-length = 100
target-version = "py311"

[lint]
preview = true
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "C4",
    "EM",
    "FA",
    "ISC",
    "LOG",
    "G",
    "PIE",
    "T20",
    "PT",
    "RSE",
    "RET",
    "SLOT",
    "SIM",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FAST",
    "PERF",
    "FURB",
    "RUF",

    # Project specific selects
    "DOC",
    "D",
]
ignore = [
    "assert",                                    # Assert used
    "magic-value-comparison",                    # Magic value used
    "ambiguous-unicode-character-comment",       # Comment contains ambiguous character
    "no-self-use",                               # Method could be a function, class method, or static method
    "any-type",                                  # typing.Any used
    "line-too-long",                             # Line too long
    "suspicious-non-cryptographic-random-usage", # Standard pseudo-random generators are not suitable for security/cryptographic purposes

    # Project specific ignores
    "builtin-argument-shadowing",     # Shadow built-in name
    "undocumented-public-module",     # Missing docstring in public module
    "undocumented-public-package",    # Missing docstring in public package
    "undocumented-magic-method",      # Missing docstring in magic method
    "undocumented-public-init",       # Missing docstring in __init__
    "docstring-missing-exception",    # Raised exception not documented
    "docstring-extraneous-exception", # Raised exception not documented
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "undefined-local-with-import-star",
    "unused-import",
] # Wildcard imports used
"tests/*.py" = ["missing-type-function-argument", "DOC", "D"]
"test.py" = ["ALL"]

[lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "ambr.models._base.BaseModel",
]

[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = "google"

[lint.isort]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[format]
skip-magic-trailing-comma = true
